<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masonry</title>
    <style>
        .left-panel{
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            width: 100px;
            min-height: 100vh;
            font-size: 40px;
            text-align: center;
            background-color: rgb(216, 120, 18);
        }
        .trash{
            margin-top: auto;
        }
        .container{
            display: flex;
            flex-wrap: wrap;
            overflow-y: auto;
            margin-left: 100px;
            gap: 5px;
        }
        .container img{
            flex: 1;
            max-width: 100%;
            height: 100px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="left-panel">
        &#x1F4F7;
        &#x1F5C4;&#xfe0f;
        &#x2764;&#xfe0f;
        <div class="trash">&#x1F5D1;&#xfe0f;</div>
    </div>
    <div class="container">
        <img src="https://picsum.photos/100/100" alt="img1">
