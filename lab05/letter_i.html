<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letter I</title>
    <style>
        .i{
            background-color: black;
            display: inline-block;
            vertical-align: top;
        }
        .il,.ir{
            background-color: white;
            display: inline-block;
            width: 20px;
            height: 50px;
        }
        .il{
            margin: 12px 5px 10px 0;
        }
        .ir{
            margin: 12px 0 10px 5px;
        }

        .t{
            background-color: red;
            display: inline-flex;
            margin-left: 20px;
            vertical-align: top;
        }
        .tl,.tr{
            background-color: white;
            display: inline-block;
            width: 25px;
            height: 70px;
        }
        .tl{
            margin: 12px 6px 0 0;
        }
        .tr{
            margin: 12px 0 0 6px;
        }

        .h{
            background-color: blue;
            display: inline-grid;
            margin-left: 20px;
            vertical-align: top;
        }
        .ht,.hb{
            background-color: white;
            display: inline-block;
            width: 25px;
            height: 35px;
        }
        .ht{
            margin: 0 12px 0 12px;
        }
        .hb{
            margin: 12px 0 0 12px;
        }

        .e{
            background-color: green;
            display: inline-grid;
            margin-left: 20px;
            vertical-align: top;
        }
        .et,.eb{
            background-color: white;
            display: inline-block;
            width: 35px;
            height: 25px;
        }
        .et{
            margin: 12px 0 0 12px;
        }
        .eb{
            margin: 12px 0 12px 12px;
        }
    </style>
</head>
<body>
    <div class="i">
        <div class="il"></div>
        <div class="ir"></div>
    </div>
    <div class="t">
        <div class="tl"></div>
        <div class="tr"></div>
    </div>
    <div class="h">
        <div class="ht"></div>
        <div class="hb"></div>
    </div>
    <div class="e">
        <div class="et"></div>
        <div class="eb"></div>
    </div>
</body>
</html>
