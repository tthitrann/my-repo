<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .parent{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child1"><img src="https://picsum.photos/200/200?random=6" alt="img1"></div>
        <div class="child2"><img src="https://picsum.photos/300/300?random=13" alt="img1"></div>
        <div class="child3"><img src="https://picsum.photos/200/200?random=2006" alt="img1"></div>
    </div>
</body>
</html>
